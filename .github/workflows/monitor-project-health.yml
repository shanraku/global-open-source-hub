name: Monitor listed project repository health

on:
  workflow_run:
    workflows: ["Refresh project repository metadata"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-health-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out latest default branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check public repository availability and status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/monitor-project-health.mjs
      - name: Commit health snapshot when changed
        run: |
          if git diff --quiet -- data/project-health.json; then
            echo "No project health changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/project-health.json
          git commit -m "chore: refresh project health snapshot"
          git push

name: Check SBOM dependencies against OSV

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sbom-osv-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check exact SBOM package versions with OSV
        run: node scripts/check-sbom-vulnerabilities.mjs
      - name: Commit dependency intelligence when changed
        run: |
          if git diff --quiet -- data/dependency-intelligence.json; then
            echo "No dependency intelligence changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dependency-intelligence.json
          git commit -m "chore: refresh SBOM dependency intelligence"
          git push

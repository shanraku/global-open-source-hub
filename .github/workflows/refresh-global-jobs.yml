name: Refresh Global Jobs feed

on:
  schedule:
    # Jobicy asks integrations to choose a consistent, non-zero minute each hour.
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-global-jobs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and safely normalize public listings
        run: node scripts/refresh-global-jobs.mjs
      - name: Commit refreshed feed when changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: refresh public global jobs feed'
          file_pattern: data/jobs.json

name: Refresh Global Jobs feed

on:
  schedule:
    # Jobicy asks integrations to choose a consistent, non-zero minute each hour.
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-global-jobs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and safely normalize public listings
        run: node scripts/refresh-global-jobs.mjs
      - name: Create or update a pull request for the refreshed feed
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/refresh-global-jobs
          delete-branch: false
          commit-message: 'chore: refresh public global jobs feed'
          title: 'chore: refresh public global jobs feed'
          body: |
            Automated refresh of the public Jobicy opportunities cache.

            - Source: Jobicy public Jobs API
            - Listings are external and are not independently verified.
            - Every listing retains its canonical Jobicy link.
            - Review the generated data before merging.
          add-paths: |
            data/jobs.json
